name: crowdlink
description: Offline mesh location & messaging app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.11.0'

dependencies:
  flutter:
    sdk: flutter

  # Location
  geolocator: ^11.0.0
  permission_handler: ^11.0.0

  # Mesh transport (handles Bluetooth + WiFi Direct automatically)
  nearby_connections: ^4.0.0

  # Offline Maps
  flutter_map: ^6.0.0
  latlong2: ^0.9.0
  url_launcher: ^6.2.0

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # State management & utils
  provider: ^6.1.0
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true